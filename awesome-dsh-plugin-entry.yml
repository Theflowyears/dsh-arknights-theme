url: https://github.com/Theflowyears/dsh-arknights-theme
name: Theflowyears/dsh-arknights-theme
category: theme
description:
  en: 'Immersion for Arknights players on the DSH Web GUI: twelve full-screen wallpapers whose blur, feathering and glass are solved from each picture, ink solved in OKLCH to hold WCAG AA, Rhodes Island iconography, and sign-off interactions — Amiya and Kal''tsit sign the approval panel, the Doctor and Theresa sign the question card.'
  zh: 为《明日方舟》玩家在 DSH Web 上构建沉浸感：12 张整屏壁纸（虚化、羽化与玻璃按每张图解算）、以 OKLCH 求解并守住 WCAG AA 的文字色、罗德岛图标体系，以及签字式的授权与选择交互 —— 权限批准条由阿米娅与凯尔希签名，选项卡由博士与特蕾西娅签名。
